name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git 날짜 정보 전체 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz
        run: git clone https://github.com/jackyzha0/quartz.git quartz-build

      - name: Install Quartz dependencies
        working-directory: quartz-build
        run: npm install --legacy-peer-deps

      - name: Copy vault content to Quartz
        run: |
          rm -rf quartz-build/content
          cp -r . quartz-build/content
          rm -rf quartz-build/content/.git
          rm -rf quartz-build/content/.github
          rm -rf quartz-build/content/.obsidian

      - name: Copy Quartz config
        run: cp quartz.config.yaml quartz-build/quartz.config.yaml

      - name: Build site
        working-directory: quartz-build
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-build/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
